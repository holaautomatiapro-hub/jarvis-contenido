<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS · Sistema Operativo de IA</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050a17'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%232f6bff'/%3E%3C/svg%3E" />
    <script>
      // Aplica el modo y el color guardados antes de pintar (ver src/lib/apariencia.js)
      try {
        var a = JSON.parse(localStorage.getItem('jarvis-apariencia'));
        if (a && a.vars) {
          var r = document.documentElement;
          r.dataset.theme = a.modo === 'sistema' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : a.theme;
          for (var k in a.vars) r.style.setProperty(k, a.vars[k]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
